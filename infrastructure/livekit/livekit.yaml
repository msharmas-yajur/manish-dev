# LiveKit Server Configuration
# For telehealth video/audio sessions

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: false

# Development keys (replace in production)
keys:
  devkey: secret

# Room settings
room:
  empty_timeout: 300
  max_participants: 10

# Logging
logging:
  level: info
  json: false

# Webhooks (optional - for session events)
# webhook:
#   urls:
#     - http://backend:8000/webhooks/livekit
#   api_key: devkey
